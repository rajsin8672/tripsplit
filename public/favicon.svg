<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="splitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#90E0EF" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#03045E"/>
  <!-- Trip Split Path - Intersecting stylized paths representing split and settlement -->
  <path d="M18 16 C18 16, 26 26, 32 32 C38 38, 46 48, 46 48" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M46 16 C46 16, 38 26, 32 32 C26 38, 18 48, 18 48" stroke="url(#splitGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Central Hub Node -->
  <circle cx="32" cy="32" r="6" fill="#CAF0F8" stroke="#03045E" stroke-width="2.5"/>
  <!-- Split End Nodes -->
  <circle cx="18" cy="16" r="3.5" fill="#00B4D8"/>
  <circle cx="46" cy="16" r="3.5" fill="#90E0EF"/>
  <circle cx="18" cy="48" r="3.5" fill="#90E0EF"/>
  <circle cx="46" cy="48" r="3.5" fill="#00B4D8"/>
</svg>
