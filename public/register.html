<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — TripSplit</title>
  <meta name="description" content="Sign up for TripSplit to start tracking group travel expenses, splitting costs, and settling debts easily.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- Site Navigation -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/index.html" class="brand-logo" aria-label="TripSplit Home">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#03045E"/>
          <path d="M9 8 C9 8, 13 13, 16 16 C19 19, 23 24, 23 24" stroke="#90E0EF" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M23 8 C23 8, 19 13, 16 16 C13 19, 9 24, 9 24" stroke="#00B4D8" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="3" fill="#CAF0F8" stroke="#03045E" stroke-width="1.5"/>
        </svg>
        <span>Trip<span class="brand-accent">Split</span></span>
      </a>

      <button type="button" class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <span class="hamburger-box" aria-hidden="true">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </span>
      </button>

      <nav aria-label="Main Navigation">
        <ul class="nav-links" id="nav-links">
          <li><a href="/index.html" class="nav-link">Home</a></li>
          <li><a href="/about.html" class="nav-link">About</a></li>
          <li><a href="/faq.html" class="nav-link">FAQ</a></li>
          <li class="nav-auth-group" id="nav-auth-container">
            <a href="/login.html" class="nav-link" id="nav-login">Login</a>
            <a href="/register.html" class="btn btn-primary btn-sm active" id="nav-register">Register</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <span class="badge badge-cyan" style="margin-bottom: 0.75rem;">Get Started</span>
        <h1>Create Your Account</h1>
        <p>Start tracking shared travel expenses with ease</p>
      </div>

      <div id="register-alert" aria-live="polite"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="reg-name" class="form-label required">Full name</label>
          <input
            type="text"
            id="reg-name"
            class="form-input"
            placeholder="e.g. Alex Morgan"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="reg-email" class="form-label required">Email address</label>
          <input
            type="email"
            id="reg-email"
            class="form-input"
            placeholder="name@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="reg-password" class="form-label required">Password</label>
          <div class="input-password-wrapper">
            <input
              type="password"
              id="reg-password"
              class="form-input"
              placeholder="Minimum 8 characters"
              autocomplete="new-password"
              required
            >
            <button type="button" class="password-toggle-btn" id="toggle-reg-password" aria-label="Show password">
              Show
            </button>
          </div>
          <span class="form-hint">Must be at least 8 characters.</span>
        </div>

        <div class="form-group">
          <label for="reg-confirm-password" class="form-label required">Confirm password</label>
          <div class="input-password-wrapper">
            <input
              type="password"
              id="reg-confirm-password"
              class="form-input"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              required
            >
            <button type="button" class="password-toggle-btn" id="toggle-reg-confirm-password" aria-label="Show confirm password">
              Show
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-checkbox-label">
            <input type="checkbox" id="reg-terms" required>
            <span>I agree to the <a href="/about.html" target="_blank">Terms of Service</a> and privacy policies of TripSplit.</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="register-submit-btn" style="margin-top: 1.5rem;">
          Create Account
        </button>
      </form>

      <div class="auth-footer-links">
        Already have an account? <a href="/login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <div>&copy; 2026 TripSplit. All rights reserved.</div>
        <div>Peer-to-peer travel expense tracking utility.</div>
      </div>
    </div>
  </footer>

  <script type="module" src="/js/navigation.js"></script>
  <script type="module" src="/js/register.js"></script>
</body>
</html>
